services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: industrial-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  dashboard:
    build: .
    container_name: industrial-dashboard
    ports:
      - "5000:5000"
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: factory/machine-01/telemetry
    depends_on:
      - mqtt
