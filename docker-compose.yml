services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: industrial-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  dashboard:
    build: .
    container_name: industrial-dashboard
    ports:
      - "5000:5000"
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: factory/conveyor-01/telemetry
    depends_on:
      - mqtt

  machine-simulator:
    build: .
    container_name: conveyor-01-simulator
    command: ["python", "mqtt_publisher.py"]
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: factory/conveyor-01/telemetry
    depends_on:
      - mqtt

  mitsubishi-gateway:
    build: .
    container_name: mitsubishi-fx5u-gateway
    command: ["python", "plc_gateway.py"]
    environment:
      PLC_IP: ${PLC_IP:-192.168.1.10}
      PLC_PORT: ${PLC_PORT:-5007}
      PLC_POLL_INTERVAL: ${PLC_POLL_INTERVAL:-1.0}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: factory/conveyor-01/telemetry
    depends_on:
      - mqtt
    profiles:
      - plc
